repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: update uv lockfile
        entry: uv lock
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
