[project]
name = "ha-surplus-power"
version = "0.1.0"
description = "Home Assistant surplus-power charging controller"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant>=2025.4.4",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-homeassistant-custom-component>=0.13.236",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
